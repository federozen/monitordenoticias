name: Monitor V11 - mesa editorial

on:
  schedule:
    - cron: "5,35 10-23 * * *"   # cada 30 min: 07:05 a 20:35 de Argentina
    - cron: "5,35 0-4 * * *"     # cada 30 min: 21:05 a 01:35 de Argentina
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: monitor-editorial-v11
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vigia.txt
      - run: pip install -r requirements-vigia.txt
      - name: Actualizar mesa editorial, Ole Hoy y hallazgos
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_PREFIX: ${{ vars.SHEET_PREFIX || 'V9_' }}
          FRECUENCIA_MINUTOS: ${{ vars.FRECUENCIA_MINUTOS || '25' }}
          MAX_ANTIGUEDAD_HORAS: ${{ vars.MAX_ANTIGUEDAD_HORAS || '4' }}
          MIN_HEALTHY_SOURCE_RATIO: ${{ vars.MIN_HEALTHY_SOURCE_RATIO || '0.60' }}
          MIN_HEALTHY_SOURCES: ${{ vars.MIN_HEALTHY_SOURCES || '35' }}
          SCRAPE_MAX_WORKERS: ${{ vars.SCRAPE_MAX_WORKERS || '5' }}
          GNEWS_MIN_INTERVAL_SECONDS: ${{ vars.GNEWS_MIN_INTERVAL_SECONDS || '0.45' }}
          GNEWS_RETRY_ATTEMPTS: ${{ vars.GNEWS_RETRY_ATTEMPTS || '2' }}
          OLE_MAX_PAGES: ${{ vars.OLE_MAX_PAGES || '8' }}
          OLE_DETAIL_DATE_LIMIT: ${{ vars.OLE_DETAIL_DATE_LIMIT || '35' }}
          DISCOVERY_MAX_AGE_HOURS: ${{ vars.DISCOVERY_MAX_AGE_HOURS || '12' }}
          DISCOVERY_MIN_SCORE: ${{ vars.DISCOVERY_MIN_SCORE || '58' }}
          TELEGRAM_MODE: ${{ vars.TELEGRAM_MODE || 'off' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
          AGENT_TELEGRAM_MODE: ${{ vars.AGENT_TELEGRAM_MODE || 'off' }}
          AGENT_FOUR_HOUR_DIGEST: ${{ vars.AGENT_FOUR_HOUR_DIGEST || 'true' }}
          EDITORIAL_SUMMARY_MIN_TOPICS: ${{ vars.EDITORIAL_SUMMARY_MIN_TOPICS || '30' }}
          EDITORIAL_SUMMARY_MAX_TOPICS: ${{ vars.EDITORIAL_SUMMARY_MAX_TOPICS || '40' }}
          AGENT_OPENING_HOUR: ${{ vars.AGENT_OPENING_HOUR || '8' }}
          AGENT_CLOSING_HOUR: ${{ vars.AGENT_CLOSING_HOUR || '23' }}
          AGENT_MAX_ALERTS: ${{ vars.AGENT_MAX_ALERTS || '4' }}
          AGENT_MAX_DISCOVERIES: ${{ vars.AGENT_MAX_DISCOVERIES || '15' }}
          AGENT_MAX_OPPORTUNITIES: ${{ vars.AGENT_MAX_OPPORTUNITIES || '6' }}
          AGENT_ALERT_SILENCE_HOURS: ${{ vars.AGENT_ALERT_SILENCE_HOURS || '6' }}
          LEGACY_MEMORY_WRITES_ENABLED: 'false'
          LEGACY_ALERTS_ENABLED: 'false'
          LEGACY_OLE_DIGEST_ENABLED: 'false'
          LEGACY_AI_PARTS_ENABLED: 'false'
        run: python vigia.py
