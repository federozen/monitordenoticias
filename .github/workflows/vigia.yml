name: Monitor V9 - asistente editorial

on:
  schedule:
    - cron: "5 10-23 * * *"
    - cron: "5 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-editorial-v9
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vigia.txt

      - name: Instalar dependencias
        run: pip install -r requirements-vigia.txt

      - name: Buscar, curar y generar informe editorial
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_PREFIX: ${{ vars.SHEET_PREFIX || 'V9_' }}

          FRECUENCIA_MINUTOS: ${{ vars.FRECUENCIA_MINUTOS || '50' }}

          TELEGRAM_MODE: ${{ vars.TELEGRAM_MODE || 'full' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
          AGENT_TELEGRAM_MODE: ${{ vars.AGENT_TELEGRAM_MODE || 'off' }}
          AGENT_HOURLY_DIGEST: ${{ vars.AGENT_HOURLY_DIGEST || 'true' }}
          AGENT_OPENING_HOUR: ${{ vars.AGENT_OPENING_HOUR || '8' }}
          AGENT_CLOSING_HOUR: ${{ vars.AGENT_CLOSING_HOUR || '23' }}
          AGENT_MAX_ALERTS: ${{ vars.AGENT_MAX_ALERTS || '4' }}
          AGENT_MAX_OPPORTUNITIES: ${{ vars.AGENT_MAX_OPPORTUNITIES || '6' }}
          AGENT_ALERT_SILENCE_HOURS: ${{ vars.AGENT_ALERT_SILENCE_HOURS || '6' }}

          LEGACY_MEMORY_WRITES_ENABLED: "false"
          LEGACY_ALERTS_ENABLED: "false"
          LEGACY_OLE_DIGEST_ENABLED: "false"
          LEGACY_AI_PARTS_ENABLED: "false"

        run: python vigia.py
